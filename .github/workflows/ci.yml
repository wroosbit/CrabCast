      #                                      page. §1 holds every fenced block
      #                                      of program output to a scenario or
      #                                      to a register entry with a reason,
      #                                      so the coverage cannot silently
      #                                      shrink. §3 alters the page six ways
      #                                      — four that must be caught, two
      #                                      that must NOT be, because a mask
      #                                      wide enough to pass against
      #                                      anything is this check's own way of
      #                                      overclaiming. §4 runs it against
      #                                      72db4cd and e7ffb58, the two
      #                                      revisions that really were stale,
      #                                      and asserts WHICH KIND of red each
      #                                      produces.
      #                                      WHAT IT CANNOT SEE: whether a
      #                                      pasted session is real rather than
      #                                      plausible — the mask removes
      #                                      exactly the values that would tell
      #                                      — and whether the page's PROSE is
      #                                      true, which is where both defects
      #                                      KAN-174 found actually were. The
      #                                      reviewer re-running the page is all
      #                                      there is for either.
      #
      # And one whose subject is not this daemon at all, but the CONVERSATION on
      # a pull request — the half of the review handoff that had no mechanism:
      #
      #   verify-approval-marker             the decision behind the
      #                                      `approval-recorded` commit status
      #                                      (KAN-402), which is published by
      #                                      `.github/workflows/approval.yml` and
      #                                      NOT by this file. It drives
      #                                      `scripts/approval-marker.mjs` over
      #                                      five acceptance cases, every one an
      #                                      OBSERVED failure on this epic rather
      #                                      than an imagined shape: no marker at
      #                                      all, a marker for a superseded head,
      #                                      the canonical marker at the current
      #                                      head, the token in the WRONG
      #                                      ARRANGEMENT, and a correct marker
      #                                      shown inside a fence, a blockquote,
      #                                      an indented block or an HTML
      #                                      comment. Its heads are this
      #                                      repository's own `HEAD` and `HEAD~1`
      #                                      rather than invented SHAs, so
      #                                      "superseded" is a real relation
      #                                      between two real commits.
      #                                      FOUR MUTATIONS, and each
      #                                      re-measures its own precondition
      #                                      first — the mutant must still ACCEPT
      #                                      the canonical marker, because a
      #                                      mutant that refuses everything
      #                                      satisfies "the case flipped" for the
      #                                      wrong reason. That precondition
      #                                      earned its keep on the first run: the
      #                                      substring mutation was BROKEN rather
      #                                      than loosened and said so by name.
      #                                      Its §2 is the false-positive half —
      #                                      an asserted marker must survive a
      #                                      pull request that also QUOTES one,
      #                                      which this very change's pull request
      #                                      does — plus a control on the control,
      #                                      two fixtures one character apart with
      #                                      opposite required verdicts.
      #                                      WHAT IT CANNOT SEE: it supplies its
      #                                      own comments, so it establishes the
      #                                      DECISION is right about a
      #                                      conversation it is handed and NOT
      #                                      that any conversation arrives.
      #                                      Reading the event, paging the
      #                                      comments, reconciling the count and
      #                                      POSTing the status are all in
      #                                      `scripts/check-approval-recorded.mjs`
      #                                      and NOTHING here executes a line of
      #                                      it; what covers that is a run against
      #                                      a real pull request with the output
      #                                      pasted on it. Named in both headers.
      #
      # verify-daemon-provenance starts daemons but needs no herdr either: it
      # drives `daemon_status`, which touches neither panes nor the herdr
      # binary. It builds its OWN fixture trees under the system temp dir — one
      # a real little git repo, one with no git metadata at all — because
      # "reports unknown rather than something plausible" cannot be
      # demonstrated in a tree that has a commit in it (KAN-122).
      #
      # DELIBERATELY EXCLUDED — seven scripts need a real herdr server and real
      # terminal panes, which no GitHub runner has (herdr's public
      # availability is itself an open question on this project). Running them
      # here would produce a red check about the runner rather than about the
      # code. They are the live half of this suite, run by hand on a machine
      # with herdr; their output goes on the PR.
      #
      # That list used to be prose right here, which is a form no check can
      # read — so it drifted, and nothing compared it to scripts/. It now
      # lives as data in the EXCLUSIONS register of
      # scripts/verify-proof-registry.mjs, where the proof-registry job reads
      # it and holds every entry to a reason and a citation (KAN-141). Do not
      # re-add the names here: two lists is two places to forget.
      #
      # THE ARRAY BELOW IS A UNION, NOT A CHOICE. It is the line concurrent
      # slices conflict on. If you are resolving that conflict, keep BOTH
      # sides' entries — taking one side retires the other's proof. The
      # proof-registry job fails by name if you get it wrong.
      # ---------------------------------------------------------------------
      - name: verify (isolatable scripts, serialized)
        run: |
          set -euo pipefail
          scripts=(
            verify-config-and-socket
            verify-activate-requires-agent
            verify-list-agents-survives-restart
            verify-agent-capacity
            verify-uncharged-agent-cost
            verify-agent-cost-attribution
            verify-cpu-headroom
            verify-io-stall-gate
            verify-restore-admission
            verify-agent-preemption
            verify-agent-power-controls
            verify-agent-resumption
            verify-mcp-tools
            verify-cli-refusal
            verify-cli-parity
            verify-herdr-version-notice
            verify-refuses-occupied-directory
            verify-idempotent-lifecycle
            verify-restart-survival
            verify-prompt-is-not-a-template
            verify-callers-directory
            verify-agy-mcp-reversal
            verify-agy-mcp-write-refusals
            verify-daemon-provenance
            verify-state-read-echoes-config
            verify-activated-by
            verify-reconfiguration-refuses
            verify-event-contract
            verify-send-confirms-delivery
            verify-submit-withheld-at-dialog
            verify-tail-asks-every-source
            verify-proof-cleans-up-when-interrupted
            verify-event-durability
            verify-fleet-enumeration
            verify-missing-agent-occupancy
            verify-fleet-read-fits-the-wire
            verify-config-echo-contract
            verify-ci-wiring-guards
            verify-ci-proof-residue-is-legible
            verify-arithmetic-expansion-is-read
            verify-mutation-harness
            verify-readme-is-current
            verify-proof-defences
            verify-status-since
            verify-daemon-started-at
            verify-daemon-status-over-mcp
            verify-read-contract
            verify-doc-set-counts
            verify-src-comment-counts
            verify-path-problem
            verify-send-contract
            verify-channel-enabled
            verify-registry-survives-retired-rows
            verify-daemon-foreground
            verify-timing-attribution
            verify-unreadable-row-standing
            verify-owner-filter
            verify-scaffolding-past-the-gate
            verify-panes-are-reclaimed
            verify-reattach-leaves-global-config-alone
            verify-trust-write-follows-home
            verify-approval-marker
            verify-pty-consumer-named
            verify-doc-proof-ci-class
            verify-launcher-args
            verify-variadic-args-swallow-prompt
            verify-proof-teardown-sweeps
            verify-butchr-proof-pin
          )
          # One at a time, and one scratch $HOME each. Both halves are
          # deliberate (KAN-88 item 11): these scripts start real daemons,
          # bind real unix sockets and — in two cases — spawn real PTYs, and a
          # full back-to-back run has been observed to produce a
          # timing-dependent failure once. Serial execution removes the
          # contention; the per-script $HOME removes the shared state that
          # would make one script's leftovers another's flake.
          failed=()
          timings=()
          for s in "${scripts[@]}"; do
            echo "::group::$s"
            home="$RUNNER_TEMP/verify-home-$s"
            mkdir -p "$home"
            t0=$(date +%s%3N)
            if HOME="$home" node "scripts/$s.mjs"; then
              verdict=PASSED
            else
              verdict=FAILED
              failed+=("$s")
            fi
            t1=$(date +%s%3N)
            # Both endpoints, subtracted by the reporter rather than here. Not
            # style: `$(( … ))` is not understood by scripts/ci-workflow.mjs's
            # shell reader, which fails the WHOLE block to "could not be read
            # as shell" — and every CI-wiring guard then reports every command
            # in it as not-live. Closed rather than open, so it goes red with a
            # confusing message rather than quiet; still a trap. See KAN-354.
            timings+=("$(printf '%s\t%s\t%s\t%s' "$s" "$t0" "$t1" "$verdict")")
            echo "--- $s $verdict in $t0..$t1 (epoch ms)"
            echo "::endgroup::"
          done
          echo
          # ATTRIBUTION (KAN-331). Which of these scripts the job's twelve
          # minutes went on, written to the run's own summary page rather than
          # only into this log — the numbers were always in the `::group::`
          # timestamps, and being in the log is what nobody reading them
          # looked like for fourteen readings.
          #
          # THIS IS NOT A GATE. It compares nothing to a threshold and cannot
          # turn the job red on cost; the verdict below is still the proofs'.
          # A deliberate decision, not an omission — docs/verify-cost.md.
          #
          # It DOES fail the step if it cannot report at all, which is the one
          # outcome worth being loud about: a reporter that silently emits
          # nothing is indistinguishable from a run with nothing to say.
          printf '%s\n' "${timings[@]}" | node scripts/ci-timing-report.mjs
          echo "ran ${#scripts[@]} script(s); ${#failed[@]} failed"
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi

  # =========================================================================
  # BUTCHR-PROOFS — Butchr's crabcast-facing proofs, run against THIS PR's
  # CrabCast, on a runner with no herdr installed.
  #
  # KAN-519, implementing KAN-117. This job owns the seam nobody owned: KAN-117's
  # task 1 showed a proof going red on a DEVELOPER MACHINE, against a REAL herdr
  # and a HAND-STARTED socket. A red seen locally is not the gate going red. This
  # is the transition — the job reds ON THE RUNNER, herdr-free, against a
  # CI-BUILT daemon.
  #
  # ⚠ WHY THERE IS A LIVE PEER HERE, WHICH IS THE ENTIRE DESIGN AND NOT SETUP.
  #
  # KAN-518 measured that against a PINNED Butchr every input the CI-runnable
  # sections read is a constant — Butchr's own source text, its own dist, or a
  # socket the script stands up itself. "A required check built from them cannot
  # change its answer in response to anything in CrabCast": it would run, cost
  # twenty minutes, and gate nothing. That is this story's own defect class
  # wearing the import as a costume.
  #
  # So this job stands up a REAL CrabCast daemon from this PR's build, behind a
  # shimmed `herdr`, and points the proofs at it. The live arms then read
  # CrabCast's OWN behaviour, which is the only thing on the path a CrabCast PR
  # can move. IF YOU REMOVE THE PEER, THIS JOB STOPS BEING A GATE — it does not
  # merely get faster. `butchr-proof-reconcile.mjs` §3 is what notices: with no
  # peer every wired proof exits 2 INCOMPLETE rather than 0, deliberately, so a
  # peer that fails to come up is a red rather than a green.
  #
  # WHICH PROOFS RUN, AND WHY NOT THE OTHER FIFTEEN. Per-arm evaluation is
  # mandatory rather than a nicety: wiring a file wholesale imports whichever of
  # its arms cannot fail as coverage it does not provide. Each of the three
  # below was MEASURED going red on a deliberate CrabCast change; the fifteen
  # excluded each carry a reason and a citation. Both lists, with the mutations
  # that produced each red, are data in
  # `scripts/butchr-proof-import-registry.mjs` — not prose here, because prose
  # is a form no check can read, which is how the old exclusion list drifted
  # (KAN-141).
  #
  # NOT A REQUIRED CHECK, AND THIS JOB DOES NOT PRETEND OTHERWISE. CrabCast
  # main's required contexts are typecheck, build, verify, proof-registry,
  # proof-verdicts. A guard arriving as its own job arrives UNGATED, and making
  # it required is a branch-protection write on an account reporting
  # admin: false — KAN-117's AC3, ruled out of scope by epic/KAN-59 and NOT
  # built toward here. Whether this should instead be a step inside the required
  # `verify` job is an open question put to epic/KAN-59; until they rule, this
  # is the ticket as written.
  # =========================================================================
  butchr-proofs:
    name: butchr-proofs
    runs-on: ubuntu-latest
    # A HANG BOUND, NOT A BUDGET — the same distinction the `verify` job's
    # timeout records. These proofs stand up daemons and wait on sockets; this
    # number exists so one that waits forever ends the job instead of the
    # runner's six-hour ceiling. Generous on purpose: three proofs, each
    # starting and tearing down a real daemon, plus a disposition pass that runs
    # four more with no peer.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # THE PIN IS READ, NEVER RETYPED. `verify-butchr-proof-pin.mjs` §2 fails
      # this workflow if a 40-character SHA appears anywhere in it, because a
      # pasted copy drifts silently while both halves go on looking
      # authoritative. One place to change it: .butchr-proof-pin.json.
      - name: check out Butchr at the pinned ref
        run: |
          set -euo pipefail
          ref="$(node -p "require('./.butchr-proof-pin.json').ref")"
          repo="$(node -p "require('./.butchr-proof-pin.json').repo")"
          echo "pin: $repo @ $ref"
          # NO --depth, NO --single-branch. A pinned SHA is not reachable from a
          # shallow default-branch fetch, and the failure would arrive as
          # "reference is not a tree" rather than as anything about depth.
          git clone --no-checkout "$repo" .butchr-proofs
          git -C .butchr-proofs checkout --detach "$ref"
          # ASSERT THE CHECKOUT IS AT THE PIN. `git checkout` of a SHA that is
          # not there fails loudly, but a clone that silently resolved something
          # else would not — and this is the one fact the whole job rests on.
          got="$(git -C .butchr-proofs rev-parse HEAD)"
          if [ "$got" != "$ref" ]; then
            echo "REFUSING: checkout is at $got, pin names $ref"
            exit 1
          fi
          echo "checkout verified at $got"

      - name: build the pinned Butchr daemon
        run: |
          set -euo pipefail
          cd .butchr-proofs/daemon
          npm ci
          # NOT PIPED. `npm run build | tail` yields tail's exit status, so a
          # failed build reads as 0 — and a proof run after a failed build ran
          # against the previous dist, which means both its outcomes mislead.
          npm run build
          echo "BUILD_EXIT=$?"

      # The register, reconciled against the proofs that actually exist at the
      # pin, plus the missing-socket disposition. Runs BEFORE the proofs: if the
      # disposition does not hold, the results below cannot be trusted to mean
      # anything, and finding that out afterwards is finding it out too late.
      - name: reconcile the register and assert the missing-socket disposition
        run: node scripts/butchr-proof-reconcile.mjs

      - name: butchr proofs (wired only, serialized)
        run: |
          set -euo pipefail
          # NOT `scripts=(`. verify-proof-registry reads THE verify job's array
          # by matching that exact line and requires there be exactly one in the
          # file; a second one here would break the audit rather than extend it.
          proofs=(
            verify-crabcast-census-disclosure
            verify-crabcast-priority-roundtrip
            verify-crabcast-supervisor-exemption
          )
          # ONE AT A TIME, AND ONE SCRATCH $HOME EACH. Both halves are
          # deliberate, and this is the comment for whoever is about to
          # parallelise this loop.
          #
          # SERIAL: every one of these starts a real CrabCast daemon that binds
          # a real unix socket. Run concurrently they contend for the socket
          # path and for the machine, and the `verify` job above has already
          # observed a timing-dependent failure from exactly that. Serial
          # execution removes the contention.
          #
          # PER-SCRIPT $HOME: this is NOT tidiness and it is NOT only about
          # leftovers. Butchr's `defaultCrabCastSocket()` ignores
          # BUTCHR_CRABCAST_SOCKET and returns $HOME/.local/share/crabcast/
          # crabcast.sock — two of the three proofs below resolve their peer that
          # way. A shared $HOME means the second proof talks to the FIRST one's
          # daemon, or to a leftover socket, and passes while proving nothing
          # about its own peer. KAN-518 hit the same trap one step out and
          # measured a misleading "EXIT=0 All assertions passed" from scripts
          # that were talking to the machine's live peer. The scratch $HOME is
          # what makes each measurement be about the daemon its own run started.
          #
          # ⚠ AND THE DIRECTORY NAME IS SHORT ON PURPOSE — `bp-` plus the
          # proof's stem, not the whole proof name. A unix socket address holds
          # at most 104 bytes, and this $HOME has
          # `/.local/share/crabcast/crabcast.sock` (36 chars) appended to it by
          # `defaultCrabCastSocket()`. Named `butchr-proof-home-$p` under
          # $RUNNER_TEMP the socket path came to 112-114 characters and CrabCast
          # REFUSED TO START — correctly, and with the arithmetic in the message.
          # Measured on the runner, all three proofs, run 32504895294. Do not
          # lengthen this stem; there are about twenty characters of headroom.
          failed=()
          for p in "${proofs[@]}"; do
            echo "::group::$p"
            home="$RUNNER_TEMP/bp-${p#verify-crabcast-}"
            rm -rf "$home"
            mkdir -p "$home"
            if HOME="$home" node scripts/butchr-proof-harness.mjs "$p"; then
              verdict=PASSED
            else
              verdict=FAILED
              failed+=("$p")
            fi
            echo "--- $p $verdict"
            echo "::endgroup::"
          done
          echo
          echo "ran ${#proofs[@]} proof(s); ${#failed[@]} failed"
          if [ ${#failed[@]} -ne 0 ]; then
            # The harness has already printed WHICH CONSUMER BEHAVIOUR broke for
            # each of these; this line is the index, not the report.
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
