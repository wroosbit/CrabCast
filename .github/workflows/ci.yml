      #                                      six-member `BLOCK_SHAPES.ConfigEcho`
      #                                      in six places from KAN-528 until a
      #                                      person read the page (KAN-512).
      #                                      Every field name on the page was
      #                                      right the whole time, which is why
      #                                      a membership check was green and
      #                                      could not have been anything else:
      #                                      a count has no member to match.
      #                                      It rules only on a count carrying a
      #                                      DEFINITE ARTICLE — "the five
      #                                      fields" is a claim about the size of
      #                                      a set, "five fields added to X" is a
      #                                      version-history delta and reconciling
      #                                      it would be nonsense — whose subject
      #                                      is named by an anchor link, by the
      #                                      section's own published name, or by
      #                                      the heading that introduces exactly
      #                                      one table. WHAT IT CANNOT SEE: a
      #                                      count whose subject is a different
      #                                      line, a section declaring more than
      #                                      one marker (it PRINTS every phrase
      #                                      it declined rather than dropping
      #                                      it), and any count in `src/` — three
      #                                      source comments carried the same
      #                                      drift and were found by reading, not
      #                                      by this. It fails closed: zero
      #                                      subjects in the tree is a FAILURE,
      #                                      because a detector that silently
      #                                      matches nothing has become the bug
      #                                      it is looking for. That last hole is
      #                                      the one verify-src-comment-counts
      #                                      now takes a narrow slice out of.
      #
      #   verify-src-comment-counts          the same defect one directory over:
      #                                      a COMMENT in `src/` or `scripts/`
      #                                      stating how many members a declared
      #                                      constant has, while the arity moved
      #                                      underneath it. Four such comments
      #                                      were live at `234243d`, one of them
      #                                      INSIDE verify-read-contract, the
      #                                      gate whose greenness made the
      #                                      surrounding claims credible; all
      #                                      were found by reading.
      #                                      ⚠ READ THE RATIO IT PRINTS BEFORE
      #                                      TRUSTING ITS GREEN. It rules on a
      #                                      COUNT WHOSE SUBJECT IS SPELLED
      #                                      BESIDE IT — "the six fields of
      #                                      `SET`", "`SET` has six members" —
      #                                      and that is about 2% of the count
      #                                      phrases in the corpus. The other
      #                                      98% is NOT held, and the script
      #                                      prints `ruled on N of M` every run
      #                                      so the green cannot be read as
      #                                      more. KAN-578 measured the three
      #                                      wider handles its ticket proposed —
      #                                      `{@link SET}` in the block, the
      #                                      constant named anywhere in the
      #                                      block, the block being the
      #                                      declaration's own — and all three
      #                                      redden correct prose: 17
      #                                      disagreements at `234243d`, 2 of
      #                                      them the defect, and one false red
      #                                      that NO correct wording can clear
      #                                      because the sentence is about a
      #                                      SUBSET of the set. WHAT IT CANNOT
      #                                      SEE: a subject named
      #                                      anaphorically ("that shape"), which
      #                                      is three of the four filed
      #                                      instances; a subject that is a TYPE
      #                                      rather than a constant with a
      #                                      runtime arity; and a QUOTATION of a
      #                                      count, which it cannot tell from a
      #                                      claim — its own first draft went
      #                                      red on its own header. It fails
      #                                      closed: zero rulings is a FAILURE.
      #                                      scripts/kan578-src-count-sweep.mjs
      #                                      is the wider-recall survey those
      #                                      numbers come from and re-takes them.
      #
      #   verify-owner-filter                an application finds ITS OWN agents
      #                                      by an opaque `owner`, and an agent
      #                                      belonging to NOBODY is handed to
      #                                      nobody. §2 is the section to read:
      #                                      absence is a real state, and a
      #                                      filter written with a truthy test
      #                                      returns every pre-`owner` agent on
      #                                      the machine to the first caller
      #                                      that asks for its own. The named
      #                                      caller is a reconciler ending
      #                                      "anything running that is not in my
      #                                      desired list → off", so that is not
      #                                      an over-reported listing, it is
      #                                      other people's agents stopped. §5
      #                                      asserts the filter is NOT a
      #                                      security boundary, deliberately and
      #                                      as intended behaviour, so nobody
      #                                      can quietly start treating it as
      #                                      one. WHAT IT CANNOT SEE: whether
      #                                      the MCP tool and the CLI pass the
      #                                      argument through — §9 reads their
      #                                      DESCRIPTIONS and nothing joins the
      #                                      surfaces to this handler — and
      #                                      whether any consumer sets an owner
      #                                      at all. Both are named in its
      #                                      header.
      #
      # And one whose subject is the only USER-FACING document, which until now
      # had no proof at all:
      #
      #   verify-readme-is-current           the README's pasted blocks still
      #                                      show what the program prints. It
      #                                      re-runs six of the page's thirteen
      #                                      program-output blocks against the
      #                                      shim and requires every line of
      #                                      that — masked, so the figures two
      #                                      runs cannot share do not matter —
      #                                      to appear IN THE PAGE'S BLOCK FOR
      #                                      THAT COMMAND, in order. Per
      #                                      command, because the drift it
      #                                      exists for (KAN-139) added the same
      #                                      five lines to `list` and to
      #                                      `status`: a page updated for one
