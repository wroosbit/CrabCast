name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # The proof list in the `verify` job below is hand-maintained, and it is the
  # one line every concurrent slice edits — it conflicted SIX times in one
  # evening, four of them on the same PR (#15 after T5, T9, KAN-136 and T2;
  # #17 after T5, where this file was the ONLY conflict in an otherwise clean
  # PR; #16 after T9). Resolving such a hunk by taking one side rather than the
  # union silently retires whichever proof lost: no error, no red check, and
  # the script sits in scripts/ looking exactly like coverage.
  #
  # This job is what notices. It reconciles every tracked scripts/verify-*.mjs
  # against two lists — the `scripts=(...)` array below, and the exclusion
  # register inside the script — and fails by name on anything in neither, or
  # on an array entry whose file is gone (KAN-141).
  #
  # It is a JOB rather than a step in `verify`, and deliberately NOT an entry
  # in that array, because a guard inside the thing it guards is not a guard:
  # the same merge resolution that drops a proof could drop the audit, and the
  # tree would go green with nothing watching. A separate job is a separate
  # region of this file, which the array's conflict hunk does not reach — and
  # deleting a whole named job is an edit a reviewer sees, not a hunk they
  # resolve. Removing it also turns verify-cli-parity §6 red, which is itself
  # an array entry the audit requires; neither can go quietly without the
  # other complaining.
  #
  # That guard is about EXECUTION, not text. Since KAN-148 the whole `run:`
  # block is lexed and parsed as shell, so the invocation counts only when it
  # BEGINS A COMMAND AT THE TOP LEVEL OF THE BLOCK. Each of these fails both
  # checks by name: deleting this step; commenting it out; hiding it behind a
  # trailing `#`; switching it off with `if:` or `continue-on-error: true`;
  # swallowing its exit code (`|| true`, `set +e`, `; true`, a bare pipe, a
  # trailing `exit 0`, backgrounding, `!`, a `trap "exit 0" EXIT`); MENTIONING
  # it rather than running it — quoted (`echo "node scripts/…"`), handed to
  # another command (`bash -c '…'`), or behind a wrapper such as `timeout`;
  # and BURYING it somewhere that may not run or whose exit status cannot get
  # out — a multi-line `if … then / node … / fi`, a `while`/`for` body, a
  # `case` arm, a heredoc, an uncalled function, `echo $(node …)`,
  # `out=$(node …)`, or a subshell with `) || true` after it.
  #
  # DO NOT READ THAT AS "EVERYTHING IS CAUGHT" — that sentence has been wrong
  # here four times. What it means is that every shape in it is broken
  # deliberately by scripts/verify-ci-wiring-guards.mjs, which runs both
  # guards against a mutated copy of this file and requires each to go red by
  # name. What is NOT caught is written down in the boundary comments of
  # scripts/ci-workflow.mjs, in the same place, and is worth reading before
  # you assume a construct is covered.
  #
  # Do not disable it to iterate — the red check is the point, and `|| true`
  # is exactly the edit nobody takes back off.
  #
  # It needs no build and no npm install: it reads this file and asks git what
  # is tracked, so it stays green (or usefully red) even when the build is not.
  proof-registry:
    name: proof-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-proof-registry.mjs

  # KAN-206: every tracked proof must have a verdict-derived exit AND something
  # able to reach it. KAN-197 is why: verify-spawn-failure-legibility.mjs was
  # 136 lines with zero assertions ending `process.exit(0)`, in the array, in
  # the registry, green, proving nothing. This is what notices.
  #
  # A JOB, and deliberately NOT an entry in the `scripts=(` array below, for
  # verify-proof-registry §4's reason — which applies here MORE directly than it
  # does there. The array is not merely where this script would sit; it is part
  # of the script's SUBJECT. Listed among the proofs it audits, it could be
  # removed by the very edit it exists to catch, and the tree would go green
  # with nothing watching. The exclusion is recorded in that script's EXCLUSIONS
  # register with this reason.
  #
  # This job MUST be a required check. Excluding it from the array without
  # gating on it would be strictly worse than leaving it in: it would run, go
  # red, and the merge button would stay green. The required list is INTENDED to be
  # five with this — typecheck, build, verify, proof-registry, proof-verdicts — but
  # that list lives in branch protection, not in this file, and nothing in this repo
  # can confirm it. If you are reading this while `proof-verdicts` is not required,
  # the exclusion in verify-proof-registry's EXCLUSIONS is unsound. See KAN-210.
  #
  # It is pure static analysis over scripts/ plus two in-process mutations of a
  # copied source file — no build, no daemon, no herdr, no PTY, no network — so
  # there is nothing in it that can be flaky. Do not soften it with
  # `continue-on-error`, an `if:`, or a path filter.
  proof-verdicts:
    name: proof-verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-proof-verdicts.mjs --verbose

  # Additive to the two required checks above (KAN-88 item 10). Until this
  # existed, every behavioural invariant in this daemon — verified activation,
  # the capacity gate's arithmetic, preemption's consent rules, restart
  # survival, the MCP tool surface — was asserted only when a human or a
  # reviewer remembered to run a script by hand.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, for two scripts: verify-ci-wiring-guards reproduces the
      # defect it exists for by loading the PRE-FIX scripts/ci-workflow.mjs out
      # of `origin/main`, and verify-readme-is-current runs itself against the
      # two README revisions that really had drifted (72db4cd, e7ffb58) — a
      # shallow clone has neither ref. Both report that section as NOT RUN
      # rather than as a pass when the ref is missing, so this is the
      # difference between the demonstration happening and it being announced
      # as absent (KAN-148, KAN-175).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # ---------------------------------------------------------------------
      # WHAT RUNS HERE, AND WHAT CANNOT
      #
      # Every script below that starts a daemon shims the `herdr` binary — a
      # fake on PATH answering in herdr's own JSON shapes — and scratches its
      # own $HOME and dataDir, so it needs nothing installed on the runner but
      # node. The daemon, router, bridge, registry, config loader, MCP server
      # and CLI they drive are all the real compiled code.
      #
      # verify-cli-parity is the exception and needs even less: it starts no
      # daemon and shims nothing. It reads `src/router.ts` and imports the
      # built COMMANDS table from `dist/cli.js`, and fails when a dispatched
      # action has neither a command nor a recorded exclusion (KAN-94).
      #
      # Two of these are new with the path-identity change, and both belong in
      # CI rather than in the hand-run half because both are about REFUSALS —
      # the one class of behaviour whose regression is silent:
      #
      #   verify-refuses-occupied-directory  `activate` refuses to spawn into a
      #                                      directory somebody else's agent is
      #                                      in, and refuses just as hard when
      #                                      herdr cannot say. Asserted against
      #                                      the stub's own argv log, so "no
      #                                      `agent start` was issued" is
      #                                      evidence rather than inference.
      #   verify-prompt-is-not-a-template    nothing interpolates the prompt,
      #                                      and an over-large one is refused
      #                                      legibly rather than truncated.
      #   verify-callers-directory           what appears in a directory the
      #                                      CALLER owns, and what `forget`
      #                                      takes back out. Also a refusal
      #                                      suite: an unparseable or
      #                                      already-taken `.mcp.json`, a server
      #                                      that cannot be supplied, and a
      #                                      human's own conversation at the
      #                                      path. Its last section MUTATES the
      #                                      things it guards and asserts the
      #                                      checks go red, because a check that
      #                                      cannot fail is not a check.
      #   verify-agy-mcp-write-refusals      the same disciplines one launcher
      #                                      over, on the antigravity CLI's
      #                                      GLOBAL config: a failed write
      #                                      refuses, and a server key that is
      #                                      already the USER'S is refused
      #                                      rather than taken over. Its §1 runs
      #                                      the data-loss sequence end to end —
      #                                      their key, an activation, a
      #                                      `forget` — and requires their entry
      #                                      to survive it; its §7a runs the
      #                                      SAME sequence against a build with
      #                                      the refusal removed and watches the
      #                                      entry be DELETED. Two positive
      #                                      controls (our own key, a sibling's)
      #                                      are what keep it distinguishable
      #                                      from a check that refuses
      #                                      everything.
      #
      # And two more, both for the same class of reason — a reconciler calls
      # these paths constantly, and every way they can break is silent:
      #
      #   verify-idempotent-lifecycle        `activate` three times leaves ONE
      #                                      pane, `deactivate` twice does not
      #                                      error, the two ways of not running
      #                                      stay distinct — and a FOREIGN pane
      #                                      still refuses, which is the
      #                                      assertion that keeps a no-op from
      #                                      swallowing T1's guard. Its stub is
      #                                      stateful: `agent start` really adds
      #                                      a pane and `pane close` really
      #                                      removes one, so the pane count is a
      #                                      measurement rather than a fixture.
      #   verify-activated-by                the supervisor of record: who
      #                                      activated whom. In CI because its
      #                                      first section is the only thing in
      #                                      this suite that proves an agent's
      #                                      IDENTITY REACHES THE DAEMON — it
      #                                      reads the `.mcp.json` the daemon
      #                                      wrote, spawns the real MCP server
      #                                      with the environment out of that
      #                                      file, and lets it build a
      #                                      three-level chain. The defect it
      #                                      exists for is a field that is
      #                                      present, correctly typed and always
      #                                      null, which every other assertion
      #                                      about it passes.
      #   verify-reconfiguration-refuses     changing a knob on a RUNNING agent
      #                                      is answered per attribute, and a
      #                                      change that would need a respawn is
      #                                      REFUSED rather than performed. It
      #                                      belongs here for the same reason
      #                                      the two above do — a refusal is the
      #                                      easiest thing in this daemon to
      #                                      regress silently, because widening
      #                                      it by one attribute leaves every
      #                                      other assertion green. So its
      #                                      refusals are asserted against
      #                                      evidence taken from OUTSIDE the
      #                                      response: the pane id, the stub's
      #                                      argv log, a hash of the
      #                                      conversation on disk, and the
      #                                      durable record read off the log.
      #                                      It iterates the classification
      #                                      table itself, so a knob added
      #                                      without a decision fails it; and it
      #                                      MUTATES the compiled daemon five
      #                                      ways — including the exact bug the
      #                                      task exists to prevent — to prove
      #                                      the assertions can go red. Its
      #                                      section 2B is the refusal's
      #                                      BOUNDARY (KAN-153): a FIRST
      #                                      configure over a live pane of ours
      #                                      with no record must be answered
      #                                      rather than refused or thrown at,
      #                                      and it produces that state by
      #                                      losing the registry while the
      #                                      stub's panes survive.
      #
      # And one for the SUITE ITSELF, which is the only script here whose
      # subject is another script:
      #
      #   verify-proof-cleans-up-when-interrupted
      #                                      a proof that cleans up only when it
      #                                      FINISHES is not a proof that cleans
      #                                      up. It spawns
      #                                      verify-send-confirms-delivery,
      #                                      waits until that run really has a
      #                                      daemon up, SIGINTs it, and counts
      #                                      what survived — because a script
      #                                      cannot meaningfully interrupt
      #                                      itself. Two orphaned daemons were
      #                                      found in the wild before this
      #                                      existed, holding sockets in scratch
      #                                      directories that had been deleted.
      #                                      Its second section strips the
      #                                      signal handler and shows the leak
      #                                      come back, so the absence asserted
      #                                      in the first is measuring something.
      #                                      Each run gets its own TMPDIR, so the
      #                                      count can never be confused by a
      #                                      concurrent run and this can never
      #                                      kill a process it did not cause.
      #
      #   verify-ci-wiring-guards            THIS FILE'S OWN WIRING, and the
      #                                      only script here that mutates a
      #                                      TRACKED file. It rewrites the
      #                                      proof-registry step of ci.yml one
      #                                      shape at a time — a multi-line
      #                                      `if` guard, a heredoc, an uncalled
      #                                      function, `echo $(node …)`,
      #                                      `out=$(node …)`, a subshell with
      #                                      `) || true`, a `trap "exit 0"
      #                                      EXIT`, `while false` — runs BOTH
      #                                      guards against it as real
      #                                      processes, and requires each to
      #                                      exit 1 with a FAIL line from its
      #                                      own CI-wiring assertion. All
      #                                      nineteen shapes KAN-141 closed are
      #                                      in the same matrix, because a
      #                                      regression there is worse than the
      #                                      bug KAN-148 fixed, and so are the
      #                                      shapes that must stay GREEN — a
      #                                      guard that flagged `&&`,
      #                                      `set -euo pipefail`, `time` or
      #                                      `FOO=1 node …` is one people route
      #                                      around. Its section 2 loads the
      #                                      PRE-FIX parser out of
      #                                      `origin/main` and shows the eight
      #                                      shapes reading as LIVE there, so
      #                                      the greens measure a change rather
      #                                      than restate an intent; that is
      #                                      what the `fetch-depth: 0` above is
      #                                      for. It restores ci.yml in a
      #                                      finally and on signals; it MARKS
      #                                      the file while it is mutated, so
      #                                      residue from a run that was
      #                                      SIGKILLed says what put it there
      #                                      rather than reading as somebody
      #                                      editing CI; it REFUSES to start
      #                                      over a dirty ci.yml, because the
      #                                      baseline it restores is whatever
      #                                      it found and a run begun over
      #                                      residue restored the residue and
      #                                      passed its own check; and its last
      #                                      section asserts the file is
      #                                      byte-identical to how it was found
      #                                      AND that git agrees it is clean
      #                                      (KAN-172). WHAT IT CANNOT SEE: it
      #                                      supplies its own workflow, so it
      #                                      does not prove that the workflow
      #                                      COMMITTED here keeps the audit
      #                                      live — the proof-registry job and
      #                                      this array cover that by running
      #                                      the guards on the real file
      #                                      (KAN-148).
      #
      #   verify-ci-proof-residue-is-legible
      #                                      the proof of those last three, and
      #                                      a separate script for the same
      #                                      reason the interrupt one above is:
      #                                      a script cannot SIGKILL itself, and
      #                                      cannot show what a SECOND run does
      #                                      over the first's leftovers without
      #                                      being that second run. It kills the
      #                                      target mid-row and reads the
      #                                      residue; strips the marker and
      #                                      kills again, so the residue goes
      #                                      anonymous and the first measurement
      #                                      is shown to be measuring the
      #                                      marker; seeds residue and watches
      #                                      the target refuse and name the dead
      #                                      run; and — the half that makes it a
      #                                      fix rather than an improvement —
      #                                      runs the version `origin/main`
      #                                      carries over the same residue and
      #                                      shows it print ALL CHECKS PASSED,
      #                                      exit 0, and leave the corrupted
      #                                      workflow in the tree. Its last
      #                                      section backs the refusal out of
      #                                      the CURRENT code and gets the same
      #                                      absorption, so it keeps proving
      #                                      something after this merges and
      #                                      `origin/main` stops being pre-fix.
      #                                      IT NEVER TOUCHES THIS FILE: the
      #                                      whole thing happens in a throwaway
      #                                      git clone under TMPDIR, because a
      #                                      proof about corrupting a tracked
      #                                      file that corrupted the real one
      #                                      when IT was killed would be the
      #                                      defect wearing the fix's clothes.
      #
      # And one whose subject is the instrument every "the checks can fail"
      # section in this suite is built on:
      #
      #   verify-mutation-harness            EVERY MUTATION IN THIS SUITE GOES
      #                                      THROUGH ONE HELPER, and that helper
      #                                      refuses to hand back a build it did
      #                                      not really edit. Eight scripts each
      #                                      had their own copy; all eight
      #                                      already counted occurrences, and all
      #                                      eight THREW when the count was
      #                                      wrong — so a drifted anchor killed
      #                                      the run and every section after it
      #                                      went unreported, which was observed
      #                                      happening (KAN-138). A failed
      #                                      mutation is now a NAMED, COUNTED
      #                                      failure that returns null, so the
      #                                      section skips and the file finishes.
      #                                      It asserts the DIAGNOSTIC TEXT and
      #                                      not merely the verdict, because
      #                                      every not-applied outcome fails
      #                                      closed and would satisfy "it went
      #                                      red" while having lost its
      #                                      diagnosis. Its last section SWEEPS
      #                                      `git ls-files scripts/verify-*.mjs`
      #                                      for anyone copying a build without
      #                                      the helper — a walk rather than a
      #                                      list, so the ninth such proof is
      #                                      caught without anyone remembering
      #                                      to add it anywhere.
      #                                      WHAT IT CANNOT SEE: it supplies its
      #                                      own mutations, so it proves the
      #                                      helper answers correctly about a
      #                                      mutation it is given — NOT that any
      #                                      real section's anchor still applies
      #                                      to today's build. Nothing owns that;
      #                                      it is proven only by those scripts
      #                                      running here, where a drifted anchor
      #                                      is now a named FAIL instead of a
      #                                      stack trace.
      #
      # And one for the send path, whose regression is silent in the worst way
      # available — it does not fail, it CLAIMS:
      #
      #   verify-send-confirms-delivery      `send_to_agent` reports whether a
      #                                      message LANDED rather than whether
      #                                      it was typed. Its shim's pane is
      #                                      stateful and can LOSE AN ENTER, so
      #                                      the witnessed failure — text left
      #                                      sitting unsubmitted in a composer,
      #                                      reported to its sender as success —
      #                                      is produced rather than described.
      #                                      Three verdicts, distinctly, and the
      #                                      keystroke log is the evidence that
      #                                      the retry never issues a second
      #                                      Ctrl+C. Its last section mutates
      #                                      the compiled daemon three ways and
      #                                      asserts each check goes red, and
      #                                      each mutation re-measures its own
      #                                      precondition against the unmutated
      #                                      build first (KAN-114).
      #                                      WHAT IT CANNOT SEE: whether a real
      #                                      Claude Code composer is marked the
      #                                      way COMPOSER_MARKERS says — a shim
      #                                      draws the marker it is checked
      #                                      against. Its live sibling covers
      #                                      that and says so in both headers.
      #
      #   verify-state-read-echoes-config    every fleet category echoes the
      #                                      agent's frozen configuration, and
      #                                      `unstartedAgents` is distinct from
      #                                      standby. A state read that omits a
      #                                      field fails silently — the caller
      #                                      gets a well-formed response with
      #                                      less in it than it should have. It
      #                                      PRODUCES every category before
      #                                      asserting on it (a completeness
      #                                      check over an empty list passes
      #                                      vacuously) and then MUTATES the
      #                                      compiled daemon to prove its own
      #                                      assertions can go red. It also
      #                                      spawns a real daemon and drives the
      #                                      real CLI and MCP server against the
      #                                      herdr shim.
      #
      # And one for restart survival, which until now had exactly ONE
      # assertion anywhere in this suite — in the live half, which CI cannot
      # run:
      #
      #   verify-restart-survival            a fresh daemon over surviving
      #                                      panes RE-ATTACHES: the row reports
      #                                      `sessionless: false` with a new
      #                                      session id, `agent start` is
      #                                      counted zero across the restart,
      #                                      and the pane count stays 1. Run
      #                                      for BOTH launchers, because the
      #                                      live proof can only afford to run
      #                                      `shell` — and `shell` is precisely
      #                                      the launcher whose runtime-free
      #                                      pane takes the other branch of
      #                                      every "does an agent exist here"
      #                                      question in this daemon (KAN-136).
      #                                      Its stub is stateful and reports a
      #                                      runtime behind a `claude` pane and
      #                                      none behind a shell, which is the
      #                                      whole of the difference between
      #                                      them as far as this code is
      #                                      concerned.
      #
      # And one for the published event surface, whose every failure mode is
      # silence on somebody else's side of a boundary:
      #
      #   verify-event-contract              all nine published events produced
      #                                      by REAL operations on a real
      #                                      daemon and received by two
      #                                      subscribers — a raw socket client
      #                                      and an MCP server over stdio —
      #                                      with structured payloads asserted
      #                                      field by field against the
      #                                      contract, because "a notification
      #                                      arrived" would pass over a payload
      #                                      that is a rendered sentence. Three
      #                                      of its seven sections MUTATE the
      #                                      compiled output and run it: the
      #                                      retired `endsWith('_event')`
      #                                      forwarder, which receives nothing
      #                                      while the allowlist receives
      #                                      everything; a daemon that
      #                                      broadcasts an off-contract action,
      #                                      which must be warned about on both
      #                                      sides and dropped rather than
      #                                      forwarded malformed; and — since
      #                                      KAN-164 — a daemon with undeclared
      #                                      fields injected at one emission
      #                                      site at TWO depths, against which
      #                                      the pre-fix depth-1 projector is
      #                                      rebuilt and shown to miss the
      #                                      deeper one. It takes
      #                                      about ninety seconds, most of it
      #                                      waiting out two real 30-second
      #                                      fleet sweeps — `agent.lost` and
      #                                      `agent.status_changed` are
      #                                      poll-derived and a proof that did
      #                                      not wait would be proving
      #                                      something else.
      #
      # And one for the three events that sit on the DURABLE WRITE PATH, whose
      # failure mode is an event that is true about the daemon and false about
      # the disk:
      #
      #   verify-event-durability            `agent.configured`, `agent.activated` and
      #                                      `agent.deactivated` REPORT whether the
      #                                      registry write landed instead of
      #                                      asserting that it did. It seals the
      #                                      registry log to 0400 and PROVES the
      #                                      seal took — attempting the same
      #                                      append itself and requiring it to
      #                                      throw — so a run as root fails
      #                                      loudly rather than exercising the
      #                                      healthy path and reporting green.
      #                                      All three events, because the defect
      #                                      as filed named one; its static half
      #                                      scans every emission site in
      #                                      router.ts and reports an uncovered
      #                                      one by name and line. Three
      #                                      mutations, each watched going red:
      #                                      the unconditional claim restored
      #                                      (events say written, responses say
      #                                      not — the defect reproduced), the
      #                                      field removed (what `origin/main`
      #                                      sends), and one site's spread
      #                                      deleted from the source so the
      #                                      static scan is shown to be
      #                                      measuring rather than counting.
      #                                      WHAT IT CANNOT SEE: it INJECTS the
      #                                      write failure rather than meeting
      #                                      one, so it proves a failed append is
      #                                      reported truthfully and NOT that a
      #                                      full disk reaches the same path.
      #
      # And one for the authoritative read itself, whose failure mode was not
      # an error but an omission a consumer could not see:
      #
      #   verify-fleet-enumeration           a consumer can enumerate a fleet
      #                                      category COMPLETELY. §2 of the
      #                                      event contract makes polling
      #                                      `list` a correctness requirement,
      #                                      and `list` returned 25 rows of a
      #                                      category newest-first with no way
      #                                      past the cap — so the row that
      #                                      fell off was the one that had been
      #                                      waiting longest, and every poll
      #                                      looked healthy (KAN-163; Butchr
      #                                      measured 89 standby agents, 25
      #                                      returned). It PRODUCES 40 standby
      #                                      agents through configure →
      #                                      activate → deactivate rather than
      #                                      writing registry rows, shows the
      #                                      oldest missing from a default
      #                                      read, walks the cursor to all 40
      #                                      including that one, and mutates
      #                                      the compiled daemon FOUR ways —
      #                                      including restoring the shipped
      #                                      defect exactly — to prove those
      #                                      assertions can go red. Its last
      #                                      section drives a real daemon, the
      #                                      real CLI (running the next-page
      #                                      command the CLI printed itself)
      #                                      and the real MCP server, because a
      #                                      mechanism that exists in the
      #                                      router and not on the surfaces a
      #                                      consumer holds is a mechanism
      #                                      nobody can use.
      #
      # And one for the same object on the OTHER surface, whose failure mode is
      # the one this whole epic keeps re-finding — a guard that exists on the
      # half nobody was told to depend on:
      #
      #   verify-config-echo-contract       the `config` echo on BOTH read
      #                                     surfaces — `list_agents` and
      #                                     `agent_status` — is swept against
      #                                     the SAME declaration the event
      #                                     projection enforces (KAN-166,
      #                                     KAN-168). KAN-164 taught
      #                                     the event path to walk `config`'s
      #                                     interior, and for one day the same
      #                                     AgentConfig rode every row of the
      #                                     poll response unexamined — the half
      #                                     §2 of the event contract makes a
      #                                     CORRECTNESS requirement. It injects
      #                                     an undeclared knob at the real
      #                                     emission site (where `configure`
      #                                     assembles the config, so the field
      #                                     travels parse → record → echo),
      #                                     watches it come back named by its
      #                                     full path on three categories AND
      #                                     still delivered — this surface
      #                                     reports where the event path drops,
      #                                     and both are observed on one daemon.
      #                                     Its §4 is the shared-declaration
      #                                     claim as a measurement: ONE edit
      #                                     adding the knob to CONFIG_FIELDS
      #                                     moves both surfaces, with no second
      #                                     list touched. FOUR mutations run
      #                                     and are watched going red or going
      #                                     quiet: the sweep removed (which is
      #                                     what main did — the field on the
      #                                     wire and a response that looks
      #                                     clean), the warning silenced with
      #                                     the sweep left in (so which artifact
      #                                     carries the answer is measured), a
      #                                     category added straight into
      #                                     respond(), which no type here can
      #                                     catch and the sweep finds anyway,
      #                                     and — §3b, KAN-168 — the
      #                                     `agent_status` sweep removed ALONE
      #                                     with the fleet sweep left in. That
      #                                     last one is not a variation on the
      #                                     others: it reproduces the state main
      #                                     was really in from KAN-166 (#29,
      #                                     2026-08-04) until KAN-168 — one
      #                                     surface guarded and one not, which
      #                                     every mutation that removes shared
      #                                     machinery is blind to.
      #                                     WHAT IT CANNOT SEE: it supplies its
      #                                     own undeclared field, so it proves
      #                                     drift WOULD be caught rather than
      #                                     that none exists — its §1 is the
      #                                     second claim, over a populated fleet
      #                                     on an unmutated build. The blocks
      #                                     outside the echo (`capacity`,
      #                                     `provenance`, `pages`, the
      #                                     `*Total`s) are still contract by
      #                                     prose and by their own proofs, and
      #                                     nothing here sweeps them.
      #
      # And one whose subject is what the OTHER proofs say about themselves:
      #
      #   verify-proof-defences              every tracked proof answers one
      #                                      question — what would make its
      #                                      central assertion go red — and the
      #                                      answer is 'mutation', a
      #                                      non-mutation 'guard' (a
      #                                      precondition, a negative case, a
      #                                      vacuity check, a canary), or
      #                                      'none'. 'none' is PERMITTED and
      #                                      has to name the behaviour it
      #                                      leaves undefended, classify the
      #                                      cost, and carry a ticket when that
      #                                      cost is real; the point is to make
      #                                      a gap visible, not to close it
      #                                      (KAN-195). A proof in scripts/
      #                                      with no entry fails BY NAME, the
      #                                      way proof-registry fails on a
      #                                      proof in neither list. Its §2 is a
      #                                      SWEEP rather than a list — it asks
      #                                      each FILE whether it reaches
      #                                      scripts/mutation.mjs and compares
      #                                      that to what the register claims,
      #                                      so a mutation deleted from a proof
      #                                      turns the entry that still claims
      #                                      one red without anyone having
      #                                      remembered anything. Its §5
      #                                      sabotages a copy of its own
      #                                      register five ways and requires
      #                                      each child to exit 1 with a named
      #                                      FAIL.
      #                                      WHAT IT CANNOT SEE: it supplies
      #                                      its own register in §5, so it
      #                                      proves the checks report correctly
      #                                      about a register they are handed —
      #                                      NOT that the register committed
      #                                      here is true. An anchor proves a
      #                                      guard's text is still present; it
      #                                      cannot prove that guard still
      #                                      defends the assertion beside it.
      #                                      That half is a reviewer reading
      #                                      the entries, and the header says
      #                                      so. It also does not check that a
      #                                      proof has a VERDICT at all —
      #                                      verify-spawn-failure-legibility
      #                                      has none and exits 0
      #                                      unconditionally, which is how
      #                                      KAN-197 exists.
      #
      # And one whose subject is the OTHER user-facing document — the read path,
      # published for the first time by KAN-277:
      #
      #   verify-read-contract               `docs/read-path-contract.md`,
      #                                      `src/read-contract.ts` and a REAL
      #                                      daemon's responses, reconciled
      #                                      pairwise in both directions.
      #                                      Checking any two of the three
      #                                      leaves the third free to be wrong,
      #                                      and the pairs fail differently:
      #                                      document against declaration is two
      #                                      files agreeing about a daemon
      #                                      neither has spoken to, and
      #                                      declaration against the wire is a
      #                                      contract nobody can read. It builds
      #                                      a fleet with EVERY category
      #                                      populated and asserts each
      #                                      non-empty before asserting its
      #                                      shape, produces all four
      #                                      `agent_status` branches including
      #                                      both refusals and asserts their
      #                                      EXACT key sets, and joins the
      #                                      document's provenance buckets
      #                                      against the legend the daemon
      #                                      actually publishes — the one
      #                                      comparison neither side owns.
      #                                      Its §6 mutates a compiled build to
      #                                      add an undocumented field to
      #                                      `list_agents` and requires the
      #                                      check to name it, deletes a row
      #                                      from a document table and requires
      #                                      the same, and bumps the declared
      #                                      version without its table row.
      #                                      WHAT IT CANNOT SEE: whether a
      #                                      bucket is the RIGHT bucket (that is
      #                                      verify-state-read-echoes-config §7,
      #                                      which makes each bucket
      #                                      demonstrate its claimed property),
      #                                      whether the version was
      #                                      INCREMENTED when it should have
      #                                      been, and whether a consumer notice
      #                                      was actually sent. All three are
      #                                      named in its header and in the
      #                                      document.
      #
      # And one whose subject is the only USER-FACING document, which until now
      # had no proof at all:
      #
      #   verify-readme-is-current           the README's pasted blocks still
      #                                      show what the program prints. It
      #                                      re-runs six of the page's thirteen
      #                                      program-output blocks against the
      #                                      shim and requires every line of
      #                                      that — masked, so the figures two
      #                                      runs cannot share do not matter —
      #                                      to appear IN THE PAGE'S BLOCK FOR
      #                                      THAT COMMAND, in order. Per
      #                                      command, because the drift it
      #                                      exists for (KAN-139) added the same
      #                                      five lines to `list` and to
      #                                      `status`: a page updated for one
      #                                      and not the other still contains
      #                                      every label somewhere, and its
      #                                      §5 BUILDS that cheaper check and
      #                                      shows it green on exactly that
      #                                      page. §1 holds every fenced block
      #                                      of program output to a scenario or
      #                                      to a register entry with a reason,
      #                                      so the coverage cannot silently
      #                                      shrink. §3 alters the page six ways
      #                                      — four that must be caught, two
      #                                      that must NOT be, because a mask
      #                                      wide enough to pass against
      #                                      anything is this check's own way of
      #                                      overclaiming. §4 runs it against
      #                                      72db4cd and e7ffb58, the two
      #                                      revisions that really were stale,
      #                                      and asserts WHICH KIND of red each
      #                                      produces.
      #                                      WHAT IT CANNOT SEE: whether a
      #                                      pasted session is real rather than
      #                                      plausible — the mask removes
      #                                      exactly the values that would tell
      #                                      — and whether the page's PROSE is
      #                                      true, which is where both defects
      #                                      KAN-174 found actually were. The
      #                                      reviewer re-running the page is all
      #                                      there is for either.
      #
      # verify-daemon-provenance starts daemons but needs no herdr either: it
      # drives `daemon_status`, which touches neither panes nor the herdr
      # binary. It builds its OWN fixture trees under the system temp dir — one
      # a real little git repo, one with no git metadata at all — because
      # "reports unknown rather than something plausible" cannot be
      # demonstrated in a tree that has a commit in it (KAN-122).
      #
      # DELIBERATELY EXCLUDED — seven scripts need a real herdr server and real
      # terminal panes, which no GitHub runner has (herdr's public
      # availability is itself an open question on this project). Running them
      # here would produce a red check about the runner rather than about the
      # code. They are the live half of this suite, run by hand on a machine
      # with herdr; their output goes on the PR.
      #
      # That list used to be prose right here, which is a form no check can
      # read — so it drifted, and nothing compared it to scripts/. It now
      # lives as data in the EXCLUSIONS register of
      # scripts/verify-proof-registry.mjs, where the proof-registry job reads
      # it and holds every entry to a reason and a citation (KAN-141). Do not
      # re-add the names here: two lists is two places to forget.
      #
      # THE ARRAY BELOW IS A UNION, NOT A CHOICE. It is the line concurrent
      # slices conflict on. If you are resolving that conflict, keep BOTH
      # sides' entries — taking one side retires the other's proof. The
      # proof-registry job fails by name if you get it wrong.
      # ---------------------------------------------------------------------
      - name: verify (isolatable scripts, serialized)
        run: |
          set -euo pipefail
          scripts=(
            verify-config-and-socket
            verify-activate-requires-agent
            verify-list-agents-survives-restart
            verify-agent-capacity
            verify-cpu-headroom
            verify-io-stall-gate
            verify-restore-admission
            verify-agent-preemption
            verify-agent-power-controls
            verify-agent-resumption
            verify-mcp-tools
            verify-cli-refusal
            verify-cli-parity
            verify-herdr-version-notice
            verify-refuses-occupied-directory
            verify-idempotent-lifecycle
            verify-restart-survival
            verify-prompt-is-not-a-template
            verify-callers-directory
            verify-agy-mcp-reversal
            verify-agy-mcp-write-refusals
            verify-daemon-provenance
            verify-state-read-echoes-config
            verify-activated-by
            verify-reconfiguration-refuses
            verify-event-contract
            verify-send-confirms-delivery
            verify-tail-asks-every-source
            verify-proof-cleans-up-when-interrupted
            verify-event-durability
            verify-fleet-enumeration
            verify-config-echo-contract
            verify-ci-wiring-guards
            verify-ci-proof-residue-is-legible
            verify-mutation-harness
            verify-readme-is-current
            verify-proof-defences
            verify-status-since
            verify-daemon-started-at
            verify-daemon-status-over-mcp
            verify-read-contract
          )
          # One at a time, and one scratch $HOME each. Both halves are
          # deliberate (KAN-88 item 11): these scripts start real daemons,
          # bind real unix sockets and — in two cases — spawn real PTYs, and a
          # full back-to-back run has been observed to produce a
          # timing-dependent failure once. Serial execution removes the
          # contention; the per-script $HOME removes the shared state that
          # would make one script's leftovers another's flake.
          failed=()
          for s in "${scripts[@]}"; do
            echo "::group::$s"
            home="$RUNNER_TEMP/verify-home-$s"
            mkdir -p "$home"
            if HOME="$home" node "scripts/$s.mjs"; then
              echo "--- $s PASSED"
            else
              echo "--- $s FAILED"
              failed+=("$s")
            fi
            echo "::endgroup::"
          done
          echo
          echo "ran ${#scripts[@]} script(s); ${#failed[@]} failed"
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
